[package]
name = "signal-receiver"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
groth16-verifier = { workspace = true }
hex-literal = "1.1.0"
alloy-sol-types = { version = "1.3.1",  default-features = false }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
